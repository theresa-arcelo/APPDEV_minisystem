<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Medication - MedTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>MedTracker</h1>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="records.html">Records</a>
        <a href="add.html">Add</a>
        <a href="edit.html" class="active">Edit</a>
      </nav>
    </header>

    <h2>Edit Medication</h2>

    <div class="notice">
      Editing: <strong>Ibuprofen</strong>
    </div>

    <form action="records.html" method="get">
      <div class="form-group">
        <label>Medication Name</label>
        <input type="text" value="Ibuprofen">
      </div>

      <div class="form-group">
        <label>Dosage (mg)</label>
        <input type="number" value="200">
      </div>

      <div class="form-group">
        <label>Frequency (per day)</label>
        <input type="number" value="3">
      </div>

      <div class="form-group">
        <label>Duration (days)</label>
        <input type="number" min="1" value="7">
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input type="date" value="2025-03-15">
      </div>

      <div class="form-group">
        <label>Category</label>
        <select>
          <option selected>Painkiller</option>
          <option>Antibiotic</option>
          <option>Vitamin</option>
          <option>Allergy</option>
          <option>Other</option>
        </select>
      </div>

      <button type="submit">Update Medication</button>
      <a href="records.html" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
