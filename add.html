<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Medication - MedTracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>MedTracker</h1>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="records.html">Records</a>
        <a href="add.html" class="active">Add</a>
        <a href="edit.html">Edit</a>
      </nav>
    </header>

    <h2>Add New Medication</h2>

    <form action="records.html" method="get">
      <div class="form-group">
        <label>Medication Name</label>
        <input type="text" placeholder="e.g. Ibuprofen">
      </div>

      <div class="form-group">
        <label>Dosage (mg)</label>
        <input type="number" placeholder="200">
      </div>

      <div class="form-group">
        <label>Frequency (per day)</label>
        <input type="number" placeholder="2">
      </div>

      <div class="form-group">
        <label>Start Date</label>
        <input type="date">
      </div>

      <div class="form-group">
        <label>Category</label>
        <select>
          <option>Painkiller</option>
          <option>Antibiotic</option>
          <option>Vitamin</option>
          <option>Allergy</option>
          <option>Other</option>
        </select>
      </div>

      <button type="submit">Save Medication</button>
      <a href="records.html" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
